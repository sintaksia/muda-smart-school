name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy — prisma.config.ts membaca DATABASE_URL saat `prisma generate`,
  # tapi generate tidak pernah konek ke DB. Test memakai mock Prisma.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall menjalankan `prisma generate` (tanpa koneksi DB)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guardrails (docs/design_system.md, CLAUDE.md) run here: banned radius /
      # shadows / deleted tokens, import boundaries and the Prisma singleton are
      # eslint errors and fail this step.
      # --max-warnings is a ratchet: the count may drop, never rise. When you
      # clear warnings, lower the number in the `lint:ci` script to lock it in.
      - name: Lint & guardrails
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Menjalankan seluruh suite + gate coverage (thresholds di vitest.config.ts)
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
